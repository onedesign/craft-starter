# Proxy the Vite dev server (and its HMR WebSocket) through the site's own origin.
# Keeps dev assets same-origin on any hostname, so mobile devices on a tunnel or
# LAN address don't hit CORS or unreachable *.ddev.site:3000 URLs.
location ^~ /__vite/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # Vite only accepts known hosts; localhost is always allowed.
    proxy_set_header Host localhost;
    proxy_read_timeout 1h;
}
